name: Prepare mobile release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/mobile-checks.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      number: ${{ steps.candidate.outputs.number }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm main still matches the checked commit
        id: head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const current = data.object.sha === context.sha;
            core.setOutput('current', current);
            if (!current) core.info('Main advanced during checks; its newer workflow will prepare the release.');
      - name: Prepare release PR or tag the merged release
        id: release
        if: steps.head.outputs.current == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select and validate the pending release
        id: candidate
        if: steps.head.outputs.current == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { findReleaseCandidate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-pr.mjs`);
            const pr = await findReleaseCandidate({ github, context });
            if (pr) {
              core.setOutput('number', pr.number);
              core.setOutput('head_sha', pr.head.sha);
              core.info(`Checking release PR #${pr.number} at ${pr.head.sha}.`);
            } else {
              core.info('No current release PR to merge.');
            }

  # Reuse the trusted workflow with read-only permissions on the exact release SHA.
  # This also avoids approval prompts on bot-created pull_request workflow runs.
  verify_release:
    needs: release
    if: needs.release.outputs.number != ''
    uses: ./.github/workflows/mobile-checks.yml
    with:
      ref: ${{ needs.release.outputs.head_sha }}

  merge_release:
    needs: [release, verify_release]
    if: needs.verify_release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Load merge logic from the checked main commit, never from the release PR.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge the checked release
        id: merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_NUMBER: ${{ needs.release.outputs.number }}
          CHECKED_HEAD: ${{ needs.release.outputs.head_sha }}
          CHECKS_RESULT: ${{ needs.verify_release.result }}
        with:
          script: |
            const { mergeCheckedRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-pr.mjs`);
            const merged = await mergeCheckedRelease({
              github, context, number: Number(process.env.RELEASE_NUMBER),
              expectedHead: process.env.CHECKED_HEAD, checksResult: process.env.CHECKS_RESULT,
            });
            core.setOutput('merged', merged);
            core.info(merged ? 'Release merged.' : 'Release or main changed; a new check run is needed.');
      # GITHUB_TOKEN merges do not trigger the push workflow. Finish tagging here.
      - name: Create the version tag and GitHub Release
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
