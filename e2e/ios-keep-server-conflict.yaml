appId: host.exp.Exponent
name: Keep Django's version after an iPhone sync conflict
---
- runFlow: flows/ios-sign-in.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: signed-in
- runFlow: flows/ios-create-flight.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: ios-synced
- tapOn: '.*KAUS-KDFW.*'
- scrollUntilVisible:
    element: Update flight
    direction: DOWN
- tapOn: Update flight
- tapOn:
    id: flight-duration
- eraseText
- inputText: '2.3'
- assertVisible:
    id: flight-duration
    text: '^2\.3$'
- tapOn: '^Flight role$'
- scrollUntilVisible:
    element:
      id: flight-save
    direction: DOWN
- tapOn:
    id: flight-save
- extendedWaitUntil:
    visible: '^2\.3$'
    timeout: 30000
- tapOn:
    id: flight-detail-back
- runScript:
    file: checkpoint.js
    env:
      STEP: edited-offline
- extendedWaitUntil:
    visible: '.*Update needed.*'
    timeout: 90000
- tapOn:
    id: logbook-menu
- tapOn: '^Settings$'
- scrollUntilVisible:
    element: Review sync issue
    direction: DOWN
- tapOn: Review sync issue
- extendedWaitUntil:
    visible: This record changed in two places. Select the version to keep.
    timeout: 30000
- assertVisible: Keep record on this device
- assertVisible: Keep record saved online
- runScript:
    file: checkpoint.js
    env:
      STEP: conflict-detected
- tapOn: Keep record saved online
- scrollUntilVisible:
    element: Choose this flight
    direction: DOWN
- tapOn: Choose this flight
- extendedWaitUntil:
    visible: 'Pending changes: 0'
    timeout: 30000
- assertNotVisible: Review sync issue
- tapOn: Show navigation menu
- tapOn: '^Logbook$'
- tapOn: '.*KAUS-KDFW.*'
- assertVisible: '^3\.4$'
- assertNotVisible: '^2\.3$'
- assertNotVisible: Update needed
- runScript:
    file: checkpoint.js
    env:
      STEP: kept-server
- takeScreenshot: ios-kept-server-flight
