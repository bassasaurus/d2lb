appId: host.exp.Exponent
name: Keep Django's version after an iPhone sync conflict
---
- runFlow: flows/ios-sign-in.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: signed-in
- runFlow: flows/ios-create-flight.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: ios-synced
- runFlow: flows/ios-edit-conflicting-flight.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: edited-offline
- runFlow: flows/ios-open-conflict.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: conflict-detected
- tapOn: Keep record saved online
- scrollUntilVisible:
    element: Choose this flight
    direction: DOWN
- tapOn: Choose this flight
- extendedWaitUntil:
    visible: 'Pending changes: 0'
    timeout: 30000
- assertNotVisible: Review sync issue
- tapOn: Show navigation menu
- tapOn: '^Logbook$'
- tapOn: '.*KAUS-KDFW.*'
- assertVisible: '^3\.4$'
- assertNotVisible: '^2\.3$'
- assertNotVisible: Update needed
- runScript:
    file: checkpoint.js
    env:
      STEP: kept-server
- takeScreenshot: ios-kept-server-flight
