appId: host.exp.Exponent
name: Sign in, save a flight, and verify it syncs on iPhone
---
- runFlow: flows/ios-sign-in.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: signed-in
- runFlow: flows/ios-create-flight.yaml
- runScript:
    file: checkpoint.js
    env:
      STEP: ios-synced
- takeScreenshot: ios-flight-synced
