appId: host.exp.exponent
name: A deleted flight stays absent after restarting offline
---
- stopApp
- launchApp:
    clearState: false
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: New Flight
    timeout: 120000
- extendedWaitUntil:
    notVisible: Sync in Progress
    timeout: 30000
- assertNotVisible: KAUS-KDFW
- takeScreenshot: deletion-persisted
