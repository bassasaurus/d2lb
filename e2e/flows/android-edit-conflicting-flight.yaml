appId: host.exp.exponent
name: Change the flight duration offline
---
- tapOn: KAUS-KDFW
- scrollUntilVisible:
    element: Update flight
    direction: DOWN
- tapOn: Update flight
- extendedWaitUntil:
    visible:
      id: flight-save
    timeout: 10000
- tapOn:
    id: flight-duration
- eraseText
- inputText: '2.3'
- assertVisible:
    id: flight-duration
    text: '^2\.3$'
- hideKeyboard
- tapOn:
    id: flight-save
- extendedWaitUntil:
    visible: '^2\.3$'
    timeout: 30000
- back
