appId: host.exp.Exponent
name: Sign in on iPhone
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: ${EXPO_URL}
- runFlow:
    when:
      visible: '^Open$'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: whats-new-dismiss
    timeout: 120000
- tapOn:
    id: whats-new-dismiss
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 120000
- tapOn:
    id: login-email
- inputText: screen-test@example.invalid
- tapOn:
    id: login-password
- inputText: Disposable-screen-test-42
- extendedWaitUntil:
    visible:
      id: login-submit
      enabled: true
    timeout: 10000
- tapOn:
    id: login-submit
- runFlow: ios-dismiss-save-login.yaml
- extendedWaitUntil:
    visible: New Flight
    timeout: 30000
- runFlow:
    when:
      visible: "(?i)^(not now|don['’]t save)$"
    file: ios-dismiss-save-login.yaml
- assertNotVisible: KAUS-KDFW
